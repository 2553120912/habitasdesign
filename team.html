<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team | Habitas Design</title>
<style>
  @font-face {
    font-family: "Halenoir";
    src: url("halenoir/HalenoirText-Regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Halenoir";
    src: url("halenoir/HalenoirText-Medium.otf") format("opentype");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Halenoir";
    src: url("halenoir/HalenoirText-DemiBold.otf") format("opentype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Halenoir";
    src: url("halenoir/HalenoirExpanded-Black.otf") format("opentype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }

  :root {
    --story-bg: #f4efe6;
    --story-surface: #f7f2e8;
    --story-text: #181818;
    --story-muted: #77706a;
    --story-line: rgba(24, 24, 24, 0.16);
    --story-content-width: min(1500px, calc(100vw - 56px));
  }

  body {
    font-family: "Halenoir", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    color: var(--story-text);
    background: var(--story-bg);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img {
    display: block;
    max-width: 100%;
  }

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 110;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    color: #fafaf8;
    background: #1a1a1a;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    transition: transform 0.4s ease;
  }

  body.header-hidden .nav {
    transform: translateY(-100%);
  }

  .nav-logo {
    display: block;
    line-height: 0;
  }

  .nav-logo img {
    display: block;
    height: 44px;
    width: auto;
    filter: invert(1);
    transition: opacity 0.3s;
  }

  .nav-logo:hover img {
    opacity: 0.7;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .lang-switch {
    display: flex;
    gap: 6px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .lang-switch button {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: inherit;
    padding: 0 4px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    opacity: 0.4;
    transition: opacity 0.3s;
    font-size: 13px;
  }

  .lang-switch button.active {
    opacity: 1;
  }

  .lang-switch button:hover {
    opacity: 0.8;
  }

  .lang-switch span {
    opacity: 0.25;
  }

  .nav-toggle {
    position: fixed;
    top: 20px;
    right: 48px;
    z-index: 140;
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }

  body.header-hidden .nav-toggle {
    background: #1a1a1a;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  .nav-toggle span {
    display: block;
    height: 2px;
    width: 22px;
    background: #fafaf8;
    transition: transform 0.35s ease, opacity 0.25s ease;
    transform-origin: center;
  }

  .nav-toggle.is-open span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .nav-toggle.is-open span:nth-child(2) {
    opacity: 0;
  }

  .nav-toggle.is-open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    max-width: 100%;
    height: 100vh;
    background: rgba(42, 42, 42, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fafaf8;
    z-index: 130;
    padding: 120px 48px 48px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate3d(0, 0, 0);
    transition: visibility 0s linear 1.5s;
    will-change: opacity;
    backface-visibility: hidden;
    contain: paint;
  }

  .sidebar.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    animation: sidebarFadeIn 1.5s cubic-bezier(0.19, 1, 0.22, 1) both;
    transition: visibility 0s;
  }

  @keyframes sidebarFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 120;
  }

  .sidebar-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar-links {
    opacity: 0;
    transition: opacity 1.1s cubic-bezier(0.19, 1, 0.22, 1) 0.15s;
    will-change: opacity;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .sidebar.is-open .sidebar-links {
    opacity: 1;
  }

  .sidebar-links a {
    position: relative;
    color: #fafaf8;
    text-decoration: none;
    font-size: 24px;
    letter-spacing: 0;
    font-weight: 500;
    display: inline-block;
  }

  .sidebar-links a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0;
    height: 1px;
    background: #fafaf8;
    transition: width 0.4s ease;
  }

  .sidebar-links a:hover::after,
  .sidebar-links a.is-active::after {
    width: 100%;
  }

  .sidebar-social {
    margin-top: auto;
    padding-top: 28px;
    border-top: 1px solid rgba(250, 250, 248, 0.18);
    display: flex;
    align-items: center;
    gap: 22px;
    opacity: 0;
    transition: opacity 1.1s cubic-bezier(0.19, 1, 0.22, 1) 0.2s;
    will-change: opacity;
  }

  .sidebar.is-open .sidebar-social {
    opacity: 1;
  }

  .sidebar-social a {
    width: 24px;
    height: 24px;
    color: rgba(250, 250, 248, 0.62);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.25s ease;
  }

  .sidebar-social a:hover,
  .sidebar-social a:focus-visible {
    color: #fafaf8;
  }

  .sidebar-social svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  body.menu-open {
    overflow: hidden;
  }

  .story-hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #e7e2da;
    color: #fafaf8;
  }

  .story-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  .story-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: rgba(0, 0, 0, 0.44);
    pointer-events: none;
  }

  .story-hero-title {
    position: absolute;
    left: 48px;
    bottom: 64px;
    z-index: 2;
    max-width: 800px;
    color: inherit;
    font-family: "Halenoir", sans-serif;
    font-size: 46px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .story-scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 32px;
    z-index: 2;
    transform: translateX(-50%);
    color: rgba(250, 250, 248, 0.78);
    font-family: "Halenoir", sans-serif;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }

  .story-main {
    background: var(--story-bg);
    padding: 0;
  }

  [data-story-panel][hidden] {
    display: none !important;
  }

  .story-content {
    width: 100%;
    padding: 0 64px 0 100px;
    display: grid;
    grid-template-columns: minmax(0, 1200px) minmax(320px, 1fr);
    gap: 64px;
    align-items: stretch;
    min-height: 68vh;
    transform: none;
  }

  .story-content > * {
    min-width: 0;
  }

  .story-carousel {
    position: relative;
    display: flex;
    flex-direction: column;
    background: transparent;
    overflow: visible;
    justify-self: end;
    width: 100%;
  }

  .story-carousel-frame {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.1)),
      #211d19;
    overflow: hidden;
  }

  .story-carousel-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .story-carousel-slide.is-active {
    opacity: 1;
  }

  .story-carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .story-carousel-placeholder {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 24% 18%, rgba(255,255,255,0.05), transparent 28%),
      linear-gradient(145deg, rgba(255,255,255,0.04), rgba(0,0,0,0.14)),
      #211d19;
  }

  .story-carousel-controls {
    display: flex;
    justify-content: flex-end;
    gap: 24px;
    margin-top: 8px;
    min-height: 24px;
    position: relative;
    z-index: 2;
  }

  .story-carousel-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    padding: 0;
    color: #1a1a1a;
    cursor: pointer;
    transition: opacity 0.3s;
    font-family: inherit;
  }

  .story-carousel-btn:hover {
    opacity: 0.45;
  }

  .story-carousel-btn svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .story-carousel-btn:disabled {
    opacity: 0.25;
    cursor: default;
  }

  .story-copy {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-bottom: 32px;
  }

  .story-title {
    font-size: clamp(24px, 3vw, 36px);
    line-height: 1.4;
    letter-spacing: 0;
    font-weight: 600;
    color: var(--story-text);
    margin-bottom: 0;
    overflow-wrap: break-word;
  }

  .story-copy p {
    max-width: 650px;
    font-size: 20px;
    line-height: 1.9;
    letter-spacing: 0.4px;
    color: #888;
    margin-bottom: 0;
    overflow-wrap: break-word;
  }

  .story-copy p:last-child {
    margin-bottom: 0;
  }

  .capability-banner {
    width: 100%;
    min-height: clamp(320px, 28vw, 380px);
    margin-top: clamp(140px, 12vw, 220px);
    padding: clamp(56px, 4.6vw, 72px) 48px clamp(44px, 3.8vw, 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 36px;
    color: #fafaf8;
    background: #1a1a1a;
  }

  .capability-title {
    width: min(100%, 720px);
    color: inherit;
    font-size: clamp(30px, 3.2vw, 46px);
    font-weight: 600;
    line-height: 1.16;
    letter-spacing: 0;
    text-align: center;
  }

  html[lang="en"] .capability-title {
    white-space: nowrap;
  }

  .capability-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    color: inherit;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 2px;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }

  .capability-link[aria-disabled="true"] {
    cursor: default;
  }

  .capability-link::after {
    content: '';
    position: absolute;
    left: 0;
    right: 2em;
    bottom: -0.09em;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.35s ease;
  }

  .capability-link:hover,
  .capability-link:focus-visible {
    opacity: 0.68;
  }

  .capability-link:hover::after,
  .capability-link:focus-visible::after {
    transform: scaleX(1);
  }

  .capability-link-icon {
    width: 1.45em;
    height: 1.45em;
    flex: 0 0 1.45em;
    border: 1px solid currentColor;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
  }

  .capability-link-icon svg {
    display: block;
    width: 0.9em;
    height: 0.9em;
  }

  .capability-link:hover .capability-link-icon,
  .capability-link:focus-visible .capability-link-icon {
    transform: translateX(0.18em);
  }

  .about-features {
    width: min(1360px, calc(100% - 96px));
    margin: clamp(140px, 12vw, 220px) auto 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: clamp(120px, 16vw, 300px);
    align-items: start;
  }

  .about-feature {
    width: min(100%, 460px);
  }

  .about-feature:first-child {
    justify-self: start;
  }

  .about-feature:last-child {
    justify-self: end;
  }

  .about-feature-heading {
    margin-bottom: 30px;
    text-align: center;
  }

  .about-feature-eyebrow {
    color: var(--story-muted);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: 0.2px;
  }

  .about-feature-title {
    margin-top: 10px;
    color: var(--story-text);
    font-size: clamp(24px, 2vw, 32px);
    line-height: 1.35;
    letter-spacing: 0;
    font-weight: 500;
  }

  .about-feature-media {
    width: 100%;
    aspect-ratio: 1 / 1.18;
    background: #ded8ce;
  }

  .about-feature:last-child .about-feature-media {
    aspect-ratio: 1 / 1.36;
  }

  .about-feature-copy {
    margin: 34px auto 0;
    max-width: 430px;
    color: #55504b;
    font-size: 18px;
    line-height: 1.55;
    letter-spacing: 0;
    text-align: center;
  }

  .team-section {
    width: 100%;
    padding: clamp(96px, 9vw, 160px) 48px 120px;
  }

  .team-grid {
    --team-card-size: clamp(320px, 38vw, 728px);
    --team-row-gap: clamp(120px, 14vw, 220px);
    --team-meta-height: 73px;
    max-width: 1820px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: clamp(96px, 14vw, 220px);
    align-items: start;
  }

  .team-column {
    display: flex;
    flex-direction: column;
    gap: var(--team-row-gap);
    min-width: 0;
  }

  .team-column--left {
    align-items: flex-start;
  }

  .team-column--right {
    align-items: flex-end;
    padding-top: clamp(120px, 13vw, 200px);
  }

  .team-card {
    width: var(--team-card-size);
    color: var(--story-text);
  }

  .team-pair {
    align-self: flex-end;
    display: flex;
    justify-content: flex-end;
    gap: clamp(18px, 2vw, 32px);
    width: max-content;
  }

  .team-pair .team-card {
    flex: 0 0 var(--team-card-size);
  }

  .team-card-spacer {
    visibility: hidden;
    pointer-events: none;
  }

  .team-card--fifth {
    margin-top: clamp(120px, 13vw, 200px);
    transform: translateX(clamp(72px, 9vw, 160px));
  }

  .team-card--sixth {
    margin-top: calc(var(--team-card-size) + var(--team-meta-height) + var(--team-row-gap));
    transform: translateX(clamp(-160px, -9vw, -72px));
  }

  .team-card--seventh {
    transform: translateX(-30px);
  }

  .team-photo {
    aspect-ratio: 1 / 1;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.16), rgba(24,24,24,0.08)),
      #ded8ce;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(24, 24, 24, 0.08);
  }

  .team-card[data-member="01"] .team-photo { background-image: url('images/Our Story/成员相册/1/1.png'); background-position: center 20%; }
  .team-card[data-member="02"] .team-photo { background-image: url('images/Our Story/成员相册/2/2.png'); }
  .team-card[data-member="03"] .team-photo { background-image: url('images/Our Story/成员相册/3/3.png'); background-position: center 15%; }
  .team-card[data-member="04"] .team-photo { background-image: url('images/Our Story/成员相册/4/4.png'); background-position: center 20%; }
  .team-card[data-member="05"] .team-photo { background-image: url('images/Our Story/成员相册/5/5.png'); background-position: center 20%; }

  .team-meta {
    padding-top: 18px;
  }

  .team-name {
    font-size: clamp(18px, 1.7vw, 24px);
    line-height: 1.35;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  .team-role {
    margin-top: 4px;
    font-size: 13px;
    line-height: 1.4;
    letter-spacing: 1.6px;
    color: var(--story-muted);
    text-transform: uppercase;
  }

  /* ===== 团队成员详情面板 ===== */
  .team-card[data-member] {
    cursor: pointer;
  }
  .team-card[data-member] .team-photo {
    transition: filter 0.4s ease, transform 0.4s ease;
  }
  .team-card[data-member]:hover .team-photo {
    filter: brightness(0.94);
  }
  .team-card[data-member]:focus-visible {
    outline: 2px solid var(--story-text);
    outline-offset: 6px;
  }

  .member-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 1200;
  }
  .member-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .member-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 50vw;
    height: 100vh;
    background: var(--story-surface);
    color: var(--story-text);
    z-index: 1210;
    transform: translateX(100%);
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: -24px 0 60px rgba(0, 0, 0, 0.12);
  }
  .member-panel.is-open {
    transform: translateX(0);
  }

  .member-scroll {
    height: 100%;
    overflow-y: auto;
    padding: 72px 56px 80px;
  }

  .member-close {
    position: absolute;
    top: 28px;
    right: 40px;
    z-index: 2;
    background: rgba(247, 242, 232, 0.85);
    border: none;
    padding: 8px 4px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 2.5px;
    color: var(--story-text);
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  .member-close:hover {
    opacity: 0.6;
  }

  .member-photo {
    width: 50%;
    aspect-ratio: 1 / 1;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.16), rgba(24,24,24,0.08)),
      #ded8ce;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(24, 24, 24, 0.08);
  }

  .member-quote {
    position: relative;
    margin: 40px 0 0;
    padding-left: 4px;
    font-family: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: clamp(22px, 2vw, 30px);
    line-height: 1.5;
    font-weight: 400;
    color: var(--story-text);
  }
  .member-quote::before {
    content: '\201C';
    display: block;
    font-family: Georgia, serif;
    font-size: 72px;
    line-height: 0.6;
    color: var(--story-line);
    margin-bottom: 8px;
  }
  .member-quote:empty {
    display: none;
  }

  .member-divider {
    border: 0;
    border-top: 1px solid var(--story-line);
    margin: 36px 0 28px;
  }

  .member-name {
    font-size: clamp(22px, 1.8vw, 28px);
    font-weight: 700;
    letter-spacing: 0.4px;
    line-height: 1.3;
  }
  .member-role {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--story-muted);
  }
  .member-edu {
    margin-top: 6px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--story-muted);
  }

  .member-bio {
    margin-top: 28px;
    font-family: Georgia, 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 16px;

let lang = localStorage.getItem('hb-lang') || 'en';

function switchLang(l) {
  if (l === lang) return;
  lang = l;
  localStorage.setItem('hb-lang', lang);
  applyLang();
}

function applyLang() {
  const idx = lang === 'cn' ? 0 : 1;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.innerHTML = t[key][idx];
  });
  document.getElementById('btn-cn').classList.toggle('active', lang === 'cn');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'en';
}

applyLang();

function toggleMenu() {
  const isOpen = document.body.classList.toggle('menu-open');
  const toggle = document.querySelector('.nav-toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.querySelector('.sidebar-overlay');
  toggle.classList.toggle('is-open', isOpen);
  toggle.setAttribute('aria-expanded', isOpen);
  sidebar.classList.toggle('is-open', isOpen);
  sidebar.setAttribute('aria-hidden', !isOpen);
  overlay.classList.toggle('is-open', isOpen);
  overlay.setAttribute('aria-hidden', !isOpen);
}

function closeMenu() {
  if (document.body.classList.contains('menu-open')) {
    toggleMenu();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
});

// ===== 团队成员详情面板 =====
(() => {
  const overlay = document.querySelector('.member-overlay');
  const panel = document.getElementById('member-panel');
  if (!overlay || !panel) return;
  const photo = document.getElementById('member-photo');
  const scroll = panel.querySelector('.member-scroll');
  const closeBtn = panel.querySelector('.member-close');
  const quoteEl = panel.querySelector('.member-quote');
  const nameEl = panel.querySelector('.member-name');
  const roleEl = panel.querySelector('.member-role');
  const eduEl = panel.querySelector('.member-edu');
  const bioEl = panel.querySelector('.member-bio');

  function openMember(id) {
    const card = document.querySelector('.team-card[data-member="' + id + '"]');
    if (!card) return;
    const cardPhoto = card.querySelector('.team-photo');
    if (cardPhoto) {
      const cs = getComputedStyle(cardPhoto);
      photo.style.backgroundImage = cs.backgroundImage;
      photo.style.backgroundColor = cs.backgroundColor;
    }
    quoteEl.setAttribute('data-i18n', 'team-quote-' + id);
    nameEl.setAttribute('data-i18n', 'team-name-' + id);
    roleEl.setAttribute('data-i18n', 'team-role-' + id);
    eduEl.setAttribute('data-i18n', 'team-edu-' + id);
    bioEl.setAttribute('data-i18n', 'team-bio-' + id);
    applyLang();
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
    if (scroll) scroll.scrollTop = 0;
    closeBtn.focus();
  }

  function closeMember() {
    if (!panel.classList.contains('is-open')) return;
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
  }

  document.querySelectorAll('.team-card[data-member]').forEach(card => {
    const id = card.getAttribute('data-member');
    card.addEventListener('click', () => openMember(id));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openMember(id);
      }
    });
  });

  overlay.addEventListener('click', closeMember);
  closeBtn.addEventListener('click', closeMember);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMember();
  });
})();

// ===== 顶栏：下滑隐藏 / 上滑出现 + 停顿 2 秒自动消失 =====
(() => {
  let lastY = window.scrollY;
  let ticking = false;
  let hideTimer = null;
  const TOP_ZONE = 80;   // 接近顶部时始终显示
  const DELTA = 5;       // 抖动阈值
  const IDLE_MS = 2000;  // 静止 2 秒后自动收起

  function autoHide() {
    if (!document.body.classList.contains('menu-open')) {
      document.body.classList.add('header-hidden');
    }
  }

  function scheduleAutoHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(autoHide, IDLE_MS);
  }

  function show() {
    document.body.classList.remove('header-hidden');
    scheduleAutoHide();
  }

  function update() {
    ticking = false;
    const y = window.scrollY;

    // 菜单打开时不隐藏顶栏
    if (document.body.classList.contains('menu-open')) {
      document.body.classList.remove('header-hidden');
      lastY = y;
      return;
    }

    if (y <= TOP_ZONE) {
      show();                                           // 接近顶部：显示，并重启计时
    } else if (y > lastY + DELTA) {
      document.body.classList.add('header-hidden');     // 向下滚：立即隐藏
      clearTimeout(hideTimer);
    } else if (y < lastY - DELTA) {
      show();                                           // 向上滚：显示，并重启计时
    }
    lastY = y;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  scheduleAutoHide();    // 首次加载后静止 2 秒也自动收起
})();
